# Gradle JVM configuration
# Aumenta la memoria disponible para Gradle (ajusta según la memoria del agente Jenkins)
org.gradle.jvmargs=-Xms256m -Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Gradle daemon configuration
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false

