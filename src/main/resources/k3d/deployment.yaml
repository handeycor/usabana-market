# Namespace opcional para aislar los recursos
apiVersion: v1
kind: Namespace
metadata:
  name: usabana-market
---
# Secret con la contraseña de Postgres (usa stringData para facilitar edición)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: usabana-market
type: Opaque
stringData:
  POSTGRES_PASSWORD: "usabana123"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: usabana-market
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
# StatefulSet de Postgres con almacenamiento persistente
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: usabana-market
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "market"
            - name: POSTGRES_USER
              value: "usabana"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# ConfigMap con variables para la app Spring (perfil dev y conexión interna a Postgres)
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-config
  namespace: usabana-market
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/market"
  SPRING_DATASOURCE_USERNAME: "usabana"
  # SERVER_PORT se puede definir aquí si quieres forzar 8090; por defecto ya está en application-dev.properties
  # SERVER_PORT: "8090"
---
# Service de la app (expuesto dentro del clúster). Cambia a NodePort o Ingress según tu entorno
apiVersion: v1
kind: Service
metadata:
  name: market-service
  namespace: usabana-market
  labels:
    app: market-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  selector:
    app: market-app
---
# Deployment de la app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-app
  namespace: usabana-market
  labels:
    app: market-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-app
  template:
    metadata:
      labels:
        app: market-app
    spec:
      containers:
        - name: app
          image: docker.io/handeycor/usabana-market:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: market-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
# Nota:
# - La aplicación expone el puerto 8090 y el contexto base /market/api según application-dev.properties y application.properties.
# - Si usas k3d con Traefik, puedes agregar un Ingress aparte que apunte a market-service:8090.
